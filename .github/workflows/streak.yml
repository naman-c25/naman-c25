name: Refresh Streak Card

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch streak SVG
        run: |
          curl -sSL --max-time 30 \
            "https://streak-stats.demolab.com/?user=naman-c25&theme=tokyonight&hide_border=true" \
            -o streak.new.svg

      - name: Validate before committing
        run: |
          # Keep the existing card if the upstream service returned an error
          if grep -qiE "something went wrong|maximum retries|rate limit" streak.new.svg; then
            echo "Upstream returned an error page - keeping previous card."
            rm streak.new.svg
            exit 0
          fi
          if [ "$(stat -c%s streak.new.svg)" -lt 1000 ]; then
            echo "Response too small to be a valid card - keeping previous card."
            rm streak.new.svg
            exit 0
          fi
          mv streak.new.svg streak.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A streak.svg
          git commit -m "chore: refresh streak card" || exit 0
          # Another workflow may push concurrently, so rebase and retry
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
